name: iOS unsigned IPA

# Builds an unsigned .ipa on a macOS runner so it can be re-signed on Windows
# with Sideloadly using a free Apple ID. No Apple Developer Program membership
# and no local Mac are required.
#
# Debug   -> development build. JS is served by Metro from your PC over Wi-Fi,
#            so you can keep iterating on JS for the 7 days the free signature
#            lasts without rebuilding. Use this for LiDAR work.
# Release -> standalone build with the JS bundle embedded. No Metro needed, but
#            every JS change requires a new build. EXPO_PUBLIC_* values are
#            inlined at build time, so set the repo secrets below before using it.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        default: Debug
        options:
          - Debug
          - Release

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show toolchain versions
        run: |
          node --version
          xcodebuild -version
          pod --version

      - name: Generate the native iOS project
        # ios/ is gitignored, so prebuild regenerates it from app.json on every run.
        # This also runs pod install, which links the local arkit-capture module.
        env:
          # Only used by the Release configuration, where Metro is not involved.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_VIEWER_URL: ${{ secrets.EXPO_PUBLIC_VIEWER_URL }}
        run: npx expo prebuild --platform ios --clean

      - name: Locate workspace and scheme
        id: xcode
        run: |
          set -euo pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Using workspace $workspace and scheme $scheme"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_VIEWER_URL: ${{ secrets.EXPO_PUBLIC_VIEWER_URL }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Package the app as an IPA
        run: |
          set -euo pipefail
          app=$(ls -d build/Build/Products/*-iphoneos/*.app | head -n 1)
          echo "Packaging $app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa-${{ inputs.configuration }}
          path: app-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
